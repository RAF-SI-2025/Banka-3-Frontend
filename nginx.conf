server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Long-cache fingerprinted assets emitted by vite under /assets/.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: every non-asset GET falls through to index.html so
    # TanStack Router handles the route client-side.
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
