name: build-and-push

on:
  push:
    branches: [main, deploy]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: registry.urosevicvuk.dev
  PROJECT: raf-banka3
  IMAGE: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    # id-token: write is required by cosign for keyless (Fulcio) signing:
    # cosign exchanges this token with the OIDC provider at
    # token.actions.githubusercontent.com to mint a short-lived cert
    # whose Subject is this workflow's URL.
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Compute tags
        id: tags
        run: |
          base="${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE }}"
          tags="$base:${{ github.sha }}"
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            tags="$tags"$'\n'"$base:main"
          fi
          if [[ "${{ github.ref }}" == "refs/heads/deploy" ]]; then
            tags="$tags"$'\n'"$base:deploy"
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            tags="$tags"$'\n'"$base:${GITHUB_REF#refs/tags/}"
            tags="$tags"$'\n'"$base:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build + push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to:   type=gha,scope=${{ env.IMAGE }},mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign (keyless)
        # Keyless signing via GitHub Actions OIDC -> Fulcio short-lived
        # cert. Signature + cert pushed to the registry; Rekor records
        # the bundle for transparency. Cluster-side Kyverno policy
        # matches on Subject (workflow URL) + OIDC issuer.
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

  # Bump overlays/dev/kustomization.yaml in Banka-3-Infrastructure to
  # the commit SHA we just built. Mirrors the backend's bump-dev-manifests
  # job so the dev environment auto-deploys frontend changes too.
  # Requires INFRA_REPO_TOKEN secret with `contents: write` on
  # Banka-3-Infrastructure.
  bump-dev-manifests:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: RAF-SI-2025/Banka-3-Infrastructure
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          ref: main

      - name: Install yq
        run: |
          sudo curl -sSfL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Bump frontend tag
        env:
          SHA: ${{ github.sha }}
        run: |
          yq -i "(.images[] | select(.name == \"registry.urosevicvuk.dev/raf-banka3/frontend\")).newTag = \"${SHA}\"" \
            overlays/dev/kustomization.yaml

      - name: Commit and push
        env:
          SHA: ${{ github.sha }}
        run: |
          git config user.name  "banka-ci"
          git config user.email "ci@raf-project.com"
          git add overlays/dev/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes (likely a re-run); nothing to push."
            exit 0
          fi
          git commit -m "ci(dev): bump frontend → ${SHA:0:8}

Origin: ${{ github.server_url }}/${{ github.repository }}/commit/${SHA}"
          for attempt in 1 2; do
            if git push origin main; then
              exit 0
            fi
            echo "push failed (attempt $attempt); rebasing and retrying"
            git pull --rebase origin main
          done
          echo "push failed after retries"; exit 1
