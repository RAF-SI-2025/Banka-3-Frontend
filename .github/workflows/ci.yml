name: ci

on:
  pull_request:
  push:
    branches: [main, rewrite]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        # Catches build-time errors tsc misses (asset paths, vite plugin
        # config). VITE_API_BASE defaults to /api (same-origin); no env
        # needed for a CI build.
        run: npm run build
