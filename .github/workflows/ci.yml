name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        # Catches build-time errors tsc misses (asset paths, vite plugin
        # config). VITE_API_BASE defaults to /api (same-origin); no env
        # needed for a CI build.
        run: npm run build

      # Catches Dockerfile drift before the post-merge build.yml tries to
      # push. No push, no sign — purely a "would the image build" gate.
      - uses: docker/setup-buildx-action@v4

      - name: Docker build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max
