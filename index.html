<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Banka 3</title>
    <script>
      // Apply persisted theme before React mounts to avoid a flash of
      // light-mode UI for dark-mode users. Mirrors lib/theme/store.ts.
      (function () {
        try {
          var raw = localStorage.getItem('banka3-theme')
          var theme = raw ? (JSON.parse(raw).state || {}).theme : 'system'
          var resolved =
            theme === 'dark' ||
            (theme !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
              ? 'dark'
              : 'light'
          if (resolved === 'dark') document.documentElement.classList.add('dark')
          document.documentElement.dataset.theme = resolved
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
